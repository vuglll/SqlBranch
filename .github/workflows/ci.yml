name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SqlBranch.slnx

      - name: Build (warnings as errors)
        run: dotnet build SqlBranch.slnx --no-restore --configuration Release

      # Integration tests are skipped here: they run only with SQLBRANCH_IT=1.
      - name: Unit tests
        run: dotnet test SqlBranch.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  # The full Docker suite gates releases: it runs on pull requests into main
  # (the dev-to-main release PR) and by hand from the Actions tab on any branch.
  integration:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pool: [loop-xfs, plain]
    env:
      SQLBRANCH_IT: "1"
      SQLBRANCH_IT_IMAGE: ubuntu:24.04
      SQLBRANCH_IT_POOL_BACKEND: ${{ matrix.pool }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install SqlPackage
        run: |
          dotnet tool install --global microsoft.sqlpackage
          echo "SQLBRANCH_IT_SQLPACKAGE=$HOME/.dotnet/tools/sqlpackage" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build SqlBranch.slnx --configuration Release

      - name: Integration tests (${{ matrix.pool }} pool)
        run: dotnet test tests/SqlBranch.IntegrationTests --no-build --configuration Release --logger "console;verbosity=normal"
