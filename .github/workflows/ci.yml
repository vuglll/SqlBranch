name: CI

# Automatic runs are off for now; start a run by hand from the Actions tab.
# To turn them back on, restore the pull_request and push triggers:
#   pull_request:
#     branches: [dev, main]
#   push:
#     branches: [dev, main]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The repository variable CI_RUNS_ON picks the runner as a JSON value, for example
    # ["self-hosted","macOS","ARM64"] for the self-hosted runner. Without it, GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SqlBranch.slnx

      - name: Build (warnings as errors)
        run: dotnet build SqlBranch.slnx --no-restore --configuration Release

      # Integration tests need Docker and run only when SQLBRANCH_IT=1,
      # which this job does not set.
      - name: Unit tests
        run: dotnet test SqlBranch.slnx --no-build --configuration Release --logger "console;verbosity=normal"
